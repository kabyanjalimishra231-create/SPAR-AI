<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPAR AI - Global Admin Control Center</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #334155;
      --accent: #6366f1;
      --neon: #00f0ff;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .admin-card {
      background: var(--card-bg);
      border: 1px solid var(--neon);
      box-shadow: 0 0 20px rgba(0,240,255,0.15);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    h2 { color: var(--neon); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }
    input:focus { border-color: var(--neon); }
    .save-btn {
      background: linear-gradient(135deg, var(--accent), var(--neon));
      color: #000;
      font-weight: 800;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>🔐 SPAR AI Global Admin Panel</h2>
    <p style="font-size: 0.85rem; color: var(--muted);">Changes published here will instantly reflect across all user applications globally.</p>

    <div class="form-group">
      <label>Admin Secret Key</label>
      <input type="password" id="adminAuthKey" placeholder="Enter Admin Secret..." />
    </div>

    <div class="form-group">
      <label>Global Groq API Key (gsk_...)</label>
      <input type="text" id="globalApiKey" placeholder="gsk_..." />
    </div>

    <div class="form-group">
      <label>Default Free Credits for New Users</label>
      <input type="number" id="globalCredits" placeholder="5" />
    </div>

    <div class="form-group">
      <label>Global Razorpay Key</label>
      <input type="text" id="globalRazorpayKey" placeholder="rzp_live_..." />
    </div>

    <button class="save-btn" id="publishBtn">🚀 Publish Changes Globally</button>
  </div>

  <script>
    document.getElementById('publishBtn').addEventListener('click', async () => {
      const authKey = document.getElementById('adminAuthKey').value;
      const apiKey = document.getElementById('globalApiKey').value.trim();
      const credits = parseInt(document.getElementById('globalCredits').value) || 5;
      const razorpay = document.getElementById('globalRazorpayKey').value.trim();

      if (!apiKey.startsWith("gsk_")) {
        alert("Please enter a valid Groq API key starting with gsk_");
        return;
      }

      // PUBLISH TO CENTRAL BACKEND / FIREBASE
      try {
        /* 
        Example API Integration:
        await fetch('https://your-api.com/update-app-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': authKey },
          body: JSON.stringify({ groqApiKey: apiKey, defaultCredits: credits, razorpayKey: razorpay })
        });
        */
        alert("Global configuration updated successfully!");
      } catch (err) {
        alert("Failed to publish configuration changes: " + err.message);
      }
    });
  </script>
</body>
</html>
