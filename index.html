<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Broadcast & AI Hub</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, textarea, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 4px; border: none; box-sizing: border-box; }
    button { background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #2563eb; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .live { background: #ef4444; color: white; }
    .offline { background: #64748b; color: white; }
    .chat-box { height: 200px; overflow-y: scroll; border: 1px solid #334155; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    .msg { margin-bottom: 8px; background: #334155; padding: 8px; border-radius: 6px; }
    .msg-actions { font-size: 11px; float: right; cursor: pointer; color: #94a3b8; }
    iframe { width: 100%; height: 400px; border: none; border-radius: 8px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 8px; width: 90%; max-width: 400px; }
  </style>
</head>
<body>
<div class="container">
  
  <!-- USER AUTH -->
  <div class="card" id="authSection">
    <h2>User Account</h2>
    <input type="text" id="usernameInput" placeholder="Enter Username">
    <button onclick="loginUser()">Set Account Name</button>
  </div>

  <!-- LIVE STREAM -->
  <div class="card">
    <h2>
      Live Stream 
      <span id="liveStatus" class="status-badge offline">OFFLINE</span>
    </h2>
    <p id="streamDescription">No active broadcast.</p>
    <div id="playerContainer"></div>
    <button onclick="openSubModal()" style="background:#f59e0b; margin-top:10px;">⭐ Get Subscription Pass</button>
  </div>

  <!-- AI ASSISTANT -->
  <div class="card">
    <h2>AI Search & Assistant</h2>
    <label>Upload Image for Vision Search:</label>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="startVoiceSearch()" style="background:#10b981;">🎤 Voice Search</button>
    <textarea id="promptInput" placeholder="Ask AI, perform image search, or type 'Generate image of...'"></textarea>
    <button onclick="processAIRequest()">Submit Request</button>
    <button onclick="speakResponse()" style="background:#8b5cf6;">🔊 Read AI Response</button>
    <div id="aiOutput" style="margin-top:15px; padding:10px; background:#0f172a; border-radius:4px;"></div>
  </div>

  <!-- CHAT HISTORY -->
  <div class="card">
    <h2>Chat & Community</h2>
    <div class="chat-box" id="chatBox"></div>
    <input type="text" id="chatMsgInput" placeholder="Type a message...">
    <button onclick="sendChatMessage()">Send Message</button>
  </div>

</div>

<!-- SUBSCRIPTION & RAZORPAY MODAL -->
<div id="subModal" class="modal">
  <div class="modal-content">
    <h3 id="planTitle">Subscription Plan</h3>
    <p style="color:#94a3b8;">Tenure: <span id="planTenureText" style="color:#f8fafc; font-weight:bold;">-</span></p>
    <p style="font-size:20px; font-weight:bold; color:#10b981;">Price: ₹<span id="finalPriceText">0</span></p>

    <label>Promo Code:</label>
    <div style="display:flex; gap:6px;">
      <input type="text" id="userPromoInput" placeholder="Enter Promo Code" style="text-transform:uppercase;">
      <button onclick="applyPromoCode()" style="width:auto; padding:0 16px;">Apply</button>
    </div>
    <p id="promoMsg" style="font-size:12px; margin:4px 0 12px 0;"></p>

    <button onclick="payWithRazorpay()" style="background:#10b981; padding:12px; font-size:16px;">Pay with Razorpay</button>
    <button onclick="closeSubModal()" style="background:#64748b; margin-top:6px;">Close</button>
  </div>
</div>

<script>
  const GROQ_API_KEY = "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";
  let currentUser = localStorage.getItem('username') || 'Guest';

  let originalPrice = 0;
  let currentFinalPrice = 0;

  function initApp() {
    if (localStorage.getItem('username')) {
      document.getElementById('authSection').innerHTML = `<h3>Logged in as: <b>${currentUser}</b></h3> <button onclick="logout()">Logout</button>`;
    }
    loadLiveData();
    renderChatHistory();
  }

  function loginUser() {
    const val = document.getElementById('usernameInput').value.trim();
    if (val) {
      localStorage.setItem('username', val);
      currentUser = val;
      location.reload();
    }
  }

  function logout() {
    localStorage.removeItem('username');
    location.reload();
  }

  function loadLiveData() {
    const liveData = JSON.parse(localStorage.getItem('liveDetails')) || { isLive: false, url: '', description: '' };
    const badge = document.getElementById('liveStatus');
    const desc = document.getElementById('streamDescription');
    const player = document.getElementById('playerContainer');

    if (liveData.isLive) {
      badge.textContent = 'LIVE';
      badge.className = 'status-badge live';
      desc.textContent = liveData.description;
      player.innerHTML = `<iframe src="${liveData.url}" allowfullscreen></iframe>`;
    } else {
      badge.textContent = 'OFFLINE';
      badge.className = 'status-badge offline';
      desc.textContent = 'Stream is currently offline.';
      player.innerHTML = '';
    }
  }

  // SUBSCRIPTION & RAZORPAY LOGIC
  function openSubModal() {
    const planData = JSON.parse(localStorage.getItem('subPlanDetails')) || { name: 'Premium Pass', price: 499, tenure: '1 Month' };
    document.getElementById('planTitle').innerText = planData.name;
    document.getElementById('planTenureText').innerText = planData.tenure;
    
    originalPrice = planData.price;
    currentFinalPrice = planData.price;
    document.getElementById('finalPriceText').innerText = currentFinalPrice;
    document.getElementById('promoMsg').innerText = '';
    document.getElementById('userPromoInput').value = '';

    document.getElementById('subModal').classList.add('active');
  }

  function closeSubModal() {
    document.getElementById('subModal').classList.remove('active');
  }

  function applyPromoCode() {
    const codeEntered = document.getElementById('userPromoInput').value.trim().toUpperCase();
    const promoData = JSON.parse(localStorage.getItem('promoDetails'));
    const msgEl = document.getElementById('promoMsg');

    if (promoData && codeEntered === promoData.code) {
      const discountAmount = (originalPrice * promoData.discount) / 100;
      currentFinalPrice = Math.max(0, originalPrice - discountAmount);
      document.getElementById('finalPriceText').innerText = currentFinalPrice.toFixed(2);
      msgEl.style.color = '#10b981';
      msgEl.innerText = `Success! ${promoData.discount}% discount applied.`;
    } else {
      msgEl.style.color = '#ef4444';
      msgEl.innerText = 'Invalid Promo Code!';
    }
  }

  function payWithRazorpay() {
    const razorpayKey = localStorage.getItem('razorpayKey');
    if (!razorpayKey) {
      alert("Razorpay API Key is not configured by Admin!");
      return;
    }

    const options = {
      "key": razorpayKey,
      "amount": currentFinalPrice * 100, // Amount in paise
      "currency": "INR",
      "name": "Live Broadcast Subscription",
      "description": document.getElementById('planTitle').innerText,
      "handler": function (response) {
        alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
        closeSubModal();
      },
      "prefill": { "name": currentUser }
    };

    const rzp = new Razorpay(options);
    rzp.open();
  }

  // CHAT HISTORY
  function getChatHistory() { return JSON.parse(localStorage.getItem('chatHistory')) || []; }

  function sendChatMessage() {
    const msgInput = document.getElementById('chatMsgInput');
    if (!msgInput.value.trim()) return;
    const history = getChatHistory();
    history.push({ id: Date.now(), user: currentUser, text: msgInput.value });
    localStorage.setItem('chatHistory', JSON.stringify(history));
    msgInput.value = '';
    renderChatHistory();
  }

  function renderChatHistory() {
    const history = getChatHistory();
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = '';
    history.forEach(item => {
      const isOwner = item.user === currentUser;
      const actions = isOwner ? `<span class="msg-actions" onclick="deleteMessage(${item.id})">Delete</span><span class="msg-actions" onclick="editMessage(${item.id})" style="margin-right:8px;">Edit</span>` : '';
      chatBox.innerHTML += `<div class="msg">${actions}<strong>${item.user}:</strong> ${item.text}</div>`;
    });
  }

  function editMessage(id) {
    const history = getChatHistory();
    const msg = history.find(m => m.id === id);
    if (msg) {
      const newText = prompt("Edit your message:", msg.text);
      if (newText) {
        msg.text = newText;
        localStorage.setItem('chatHistory', JSON.stringify(history));
        renderChatHistory();
      }
    }
  }

  function deleteMessage(id) {
    let history = getChatHistory();
    history = history.filter(m => m.id !== id);
    localStorage.setItem('chatHistory', JSON.stringify(history));
    renderChatHistory();
  }

  // AI & VOICE FUNCTIONS
  function startVoiceSearch() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("Browser does not support Voice Recognition");
    const recognition = new SpeechRecognition();
    recognition.start();
    recognition.onresult = (event) => {
      document.getElementById('promptInput').value = event.results[0][0].transcript;
      processAIRequest();
    };
  }

  function speakResponse() {
    const text = document.getElementById('aiOutput').innerText;
    if (!text) return;
    const utterance = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(utterance);
  }

  async function processAIRequest() {
    const prompt = document.getElementById('promptInput').value;
    const imageInput = document.getElementById('imageInput').files[0];
    const out = document.getElementById('aiOutput');
    out.innerHTML = "Processing...";

    if (prompt.toLowerCase().startsWith("generate image")) {
      const cleanPrompt = encodeURIComponent(prompt);
      out.innerHTML = `<img src="https://image.pollinations.ai/prompt/${cleanPrompt}?width=800&height=500&nologo=true" style="width:100%; border-radius:6px;" />`;
      return;
    }

    try {
      let payload = {
        model: imageInput ? "qwen-2.5-vl-7b-instruct" : "llama-3.3-70b-versatile",
        messages: []
      };

      if (imageInput) {
        const base64Img = await convertBase64(imageInput);
        payload.messages.push({
          role: "user",
          content: [
            { type: "text", text: prompt || "Describe this image in detail." },
            { type: "image_url", image_url: { url: base64Img } }
          ]
        });
      } else {
        payload.messages.push({ role: "user", content: prompt });
      }

      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      out.innerText = data.choices[0].message.content;
    } catch (err) {
      out.innerText = "Error: " + err.message;
    }
  }

  function convertBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = (err) => reject(err);
    });
  }

  initApp();
</script>
</body>
</html>
