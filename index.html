<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Assistant App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background-color: #1f1f1f; padding: 16px; text-align: center; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: #333; color: #aaa; }
    .status-badge.online { background: #1b4332; color: #40c057; }
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .user { align-self: flex-end; background-color: #2e66e5; color: white; border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background-color: #2a2a2a; color: #e0e0e0; border-bottom-left-radius: 4px; }
    .system-error { align-self: center; background-color: #3d1414; color: #ff6b6b; font-size: 0.85rem; border: 1px solid #842020; }
    #input-container { padding: 12px; background-color: #1f1f1f; border-top: 1px solid #333; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #444; background-color: #2a2a2a; color: white; outline: none; font-size: 0.95rem; }
    input[type="text"]:focus { border-color: #2e66e5; }
    button { background-color: #2e66e5; color: white; border: none; padding: 0 18px; border-radius: 24px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #key-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .modal-card { background: #222; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #444; }
    .modal-card h3 { color: white; font-size: 1.2rem; }
    .modal-card p { font-size: 0.85rem; color: #aaa; }
    .modal-card input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; }
  </style>
</head>
<body>

  <header>
    <span>AI Assistant</span>
    <span id="env-badge" class="status-badge">Detecting...</span>
  </header>

  <div id="chat-container">
    <div class="message assistant">Hello! How can I assist you today?</div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>

  <!-- API KEY SETTINGS MODAL -->
  <div id="key-modal" style="display: none;">
    <div class="modal-card">
      <h3>Groq API Key Required</h3>
      <p>Enter your Groq API key below (starts with <code>gsk_</code>). It will be stored safely in your local device storage.</p>
      <input type="text" id="api-key-input" placeholder="gsk_..." />
      <button id="save-key-btn">Save Key & Continue</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION & AUTO-DETECTION
    // ==========================================
    const CONFIG = {
      // ENTER YOUR API KEY HERE OR LEAVE IT BLANK TO USE THE ON-SCREEN PROMPT
      DEFAULT_API_KEY: "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", 
      GROQ_URL: "https://api.groq.com/openai/v1/chat/completions",
      MODEL: "llama-3.3-70b-versatile"
    };

    // Detect Environment (Android WebView, Mobile, or Web)
    function detectEnvironment() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroidApp = typeof window.AndroidInterface !== "undefined" || /wv|Android.*Version\/[0-9]\.[0-9]/i.test(ua);
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      
      const badge = document.getElementById("env-badge");
      if (isAndroidApp) {
        badge.textContent = "Android App";
        badge.classList.add("online");
      } else if (isMobile) {
        badge.textContent = "Mobile Web";
      } else {
        badge.textContent = "Desktop Web";
      }
    }

    // Get active API Key (from LocalStorage or Hardcoded Config)
    function getApiKey() {
      const storedKey = localStorage.getItem("GROQ_API_KEY");
      if (storedKey && storedKey.trim().startsWith("gsk_")) {
        return storedKey.trim();
      }
      if (CONFIG.DEFAULT_API_KEY && CONFIG.DEFAULT_API_KEY.startsWith("gsk_")) {
        return CONFIG.DEFAULT_API_KEY.trim();
      }
      return null;
    }

    // UI Elements
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const keyModal = document.getElementById("key-modal");
    const apiKeyInput = document.getElementById("api-key-input");
    const saveKeyBtn = document.getElementById("save-key-btn");

    let messagesHistory = [];

    function appendMessage(role, text) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", role);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        keyModal.style.display = "flex";
        return;
      }

      appendMessage("user", text);
      userInput.value = "";
      sendBtn.disabled = true;

      messagesHistory.push({ role: "user", content: text });

      try {
        const response = await fetch(CONFIG.GROQ_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: CONFIG.MODEL,
            messages: messagesHistory
          })
        });

        const data = await response.json();

        if (!response.ok) {
          if (data.error && data.error.code === "invalid_api_key") {
            localStorage.removeItem("GROQ_API_KEY");
            throw new Error("Invalid API Key. Please check your key and try again.");
          }
          throw new Error(data.error?.message || "Failed to reach Groq API.");
        }

        const reply = data.choices[0].message.content;
        messagesHistory.push({ role: "assistant", content: reply });
        appendMessage("assistant", reply);

      } catch (err) {
        appendMessage("system-error", `Error: ${err.message}`);
        if (err.message.includes("Invalid API Key")) {
          keyModal.style.display = "flex";
        }
      } finally {
        sendBtn.disabled = false;
      }
    }

    // Modal Event Handlers
    saveKeyBtn.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (key.startsWith("gsk_")) {
        localStorage.setItem("GROQ_API_KEY", key);
        keyModal.style.display = "none";
        appendMessage("assistant", "API Key saved successfully! You can now send messages.");
      } else {
        alert("Invalid key format. Groq API keys must start with 'gsk_'.");
      }
    });

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Initialize App
    detectEnvironment();
    if (!getApiKey()) {
      keyModal.style.display = "flex";
    }
  </script>
</body>
</html>
