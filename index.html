<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spar AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Razorpay Payment Gateway Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { height: 100vh; height: 100dvh; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2d2f31; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#131314] text-gray-100 font-sans flex flex-col justify-between overflow-hidden antialiased">

    <!-- HEADER / NAVIGATION -->
    <header class="border-b border-[#2d2f31] bg-[#1e1f20] px-3 sm:px-4 py-2.5 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-2 sm:gap-3">
            <button onclick="toggleHistoryDrawer()" class="text-gray-400 hover:text-white text-base p-1.5 rounded-lg bg-[#131314] border border-[#2d2f31]" title="Chat History">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="w-8 h-8 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-sm border border-blue-500/30">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <div>
                <span class="font-bold text-base sm:text-lg text-gray-100 tracking-wide">Spar AI</span>
                <span id="user-plan-badge" class="hidden sm:inline-block text-[10px] bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full ml-2">Spar AI Pro (1 Month)</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- NEW CHAT BUTTON -->
            <button onclick="createNewChatSession()" title="New Chat" class="px-2.5 py-1.5 bg-blue-600/20 border border-blue-500/30 text-blue-400 hover:bg-blue-600 hover:text-white rounded-full text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">New Chat</span>
            </button>

            <!-- ACCOUNT / USER CREATION & IDENTITY BUTTON -->
            <div id="user-account-badge" class="bg-[#131314] border border-[#2d2f31] px-2.5 py-1 rounded-full text-xs text-gray-300 flex items-center gap-1.5 cursor-pointer hover:border-blue-500 transition" onclick="openAuthModal()">
                <i class="fa-solid fa-circle-user text-blue-400 text-xs"></i>
                <span id="user-account-id" class="text-[11px] font-medium text-gray-200">Account</span>
            </div>

            <!-- CREDITS DISPLAY -->
            <div class="bg-[#131314] border border-[#2d2f31] px-3 py-1 rounded-full text-xs text-gray-300 flex items-center gap-1.5">
                <i class="fa-solid fa-bolt text-purple-400 text-[10px]"></i>
                <span>Credits: <strong id="user-credits-display" class="text-purple-400">5</strong></span>
            </div>

            <!-- ADMIN LINK -->
            <a href="admin.html" class="px-3 py-1.5 bg-[#2d2f31] hover:bg-gray-700 text-gray-200 rounded-full text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-gear"></i> <span class="hidden sm:inline">Admin</span>
            </a>
        </div>
    </header>

    <!-- SIDE DRAWER FOR CHAT HISTORY & MANAGEMENT -->
    <div id="history-drawer" class="fixed inset-y-0 left-0 w-72 bg-[#1e1f20] border-r border-[#2d2f31] z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b border-[#2d2f31] flex justify-between items-center">
            <h3 class="font-bold text-sm text-gray-100 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> Saved Chats
            </h3>
            <button onclick="toggleHistoryDrawer()" class="text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto p-3 space-y-2">
            <!-- Saved Chat items with Rename/Delete buttons will render here -->
        </div>
        <div class="p-3 border-t border-[#2d2f31]">
            <button onclick="createNewChatSession()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> Start New Chat
            </button>
        </div>
    </div>
    <div id="drawer-backdrop" onclick="toggleHistoryDrawer()" class="fixed inset-0 bg-black/50 z-40 hidden"></div>

    <!-- MAIN CHAT AREA -->
    <main id="chat-container" class="flex-1 w-full max-w-4xl mx-auto p-3 sm:p-5 flex flex-col min-h-0 overflow-y-auto space-y-4">
        <div class="bg-[#1e1f20] border border-[#2d2f31] p-4 rounded-2xl space-y-2 shrink-0">
            <h2 class="font-bold text-base text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-robot"></i> Spar AI Assistant
            </h2>
            <p class="text-xs text-gray-300 leading-relaxed">
                Powered by Groq High-Speed Inference. Ask anything or attach an image below.
            </p>
        </div>
        <!-- Active Chat Messages Render Here -->
    </main>

    <!-- INPUT CONTROLS -->
    <footer class="p-3 sm:p-4 bg-[#131314] border-t border-[#2d2f31] shrink-0">
        <div class="max-w-4xl mx-auto space-y-2">
            
            <!-- IMAGE PREVIEW THUMBNAIL -->
            <div id="image-preview-box" class="hidden flex items-center gap-2 bg-[#1e1f20] border border-[#2d2f31] p-2 rounded-xl w-max">
                <img id="image-preview-thumb" src="" class="w-10 h-10 object-cover rounded-lg">
                <div class="text-xs">
                    <span id="image-file-name" class="block text-gray-200 font-medium truncate max-w-[140px]">Image attached</span>
                    <span class="text-[10px] text-blue-400">Ready for search</span>
                </div>
                <button onclick="removeAttachedImage()" class="text-gray-400 hover:text-red-400 ml-2 p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- CHAT INPUT BAR -->
            <div class="flex items-center gap-2 bg-[#1e1f20] border border-[#2d2f31] rounded-2xl px-3 py-2 focus-within:border-blue-500 transition">
                
                <input type="file" id="image-file-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                
                <button onclick="document.getElementById('image-file-input').click()" title="Attach Image" class="text-gray-400 hover:text-blue-400 p-2 transition">
                    <i class="fa-solid fa-image text-base"></i>
                </button>

                <input id="user-input" type="text" placeholder="Ask anything or search with image..." class="flex-1 bg-transparent text-xs sm:text-sm text-gray-100 focus:outline-none px-2" onkeypress="if(event.key==='Enter') handleSendMessage()">

                <button id="send-btn" onclick="handleSendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-xl transition flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>

            <!-- FOOTER INFO BAR -->
            <div class="flex justify-between items-center text-[10px] text-gray-500 px-2">
                <span>Plan Rate: <b id="user-price-display" class="text-gray-400 cursor-pointer hover:text-blue-400 transition" onclick="openRazorpaySubscription()" title="Click to Subscribe">$4.99 / Month</b></span>
                <button onclick="openRatingModal()" class="hover:text-yellow-400 transition flex items-center gap-1">
                    <i class="fa-solid fa-star text-yellow-400"></i> Leave Feedback
                </button>
            </div>

        </div>
    </footer>

    <!-- AUTH / USER ACCOUNT MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1e1f20] border border-[#2d2f31] p-5 rounded-2xl max-w-sm w-full space-y-4">
            <div class="flex justify-between items-center border-b border-[#2d2f31] pb-2">
                <h3 id="auth-title" class="font-bold text-sm text-gray-100">User Account</h3>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="account-info-view" class="space-y-3">
                <div class="bg-[#131314] p-3 rounded-xl border border-[#2d2f31] text-xs space-y-1">
                    <p class="text-gray-400">Logged in as:</p>
                    <p id="current-username-display" class="font-bold text-blue-400 text-sm"></p>
                </div>
                <button onclick="switchAuthTab('signup')" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-xl transition">
                    Create New Account
                </button>
                <button onclick="switchAuthTab('login')" class="w-full py-2 bg-[#2d2f31] hover:bg-gray-700 text-gray-200 font-semibold text-xs rounded-xl transition">
                    Switch / Login Account
                </button>
            </div>

            <div id="account-form-view" class="hidden space-y-3">
                <input id="auth-username" type="text" placeholder="Enter Username / Email" class="w-full bg-[#131314] border border-[#2d2f31] text-xs p-2.5 rounded-xl text-gray-100 focus:outline-none focus:border-blue-500">
                <input id="auth-password" type="password" placeholder="Enter Password" class="w-full bg-[#131314] border border-[#2d2f31] text-xs p-2.5 rounded-xl text-gray-100 focus:outline-none focus:border-blue-500">
                
                <div class="flex gap-2 pt-2">
                    <button onclick="switchAuthTab('info')" class="flex-1 py-2 bg-[#2d2f31] text-xs rounded-xl">Cancel</button>
                    <button id="auth-submit-btn" onclick="submitAuthForm()" class="flex-1 py-2 bg-blue-600 text-xs font-bold rounded-xl">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- RATING MODAL -->
    <div id="rating-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1e1f20] border border-[#2d2f31] p-5 rounded-2xl max-w-sm w-full space-y-4">
            <h3 class="font-bold text-sm text-gray-100">Rate Spar AI</h3>
            
            <div class="flex justify-center gap-2 text-xl text-yellow-400">
                <i class="fa-solid fa-star cursor-pointer" onclick="setRating(1)"></i>
                <i class="fa-solid fa-star cursor-pointer" onclick="setRating(2)"></i>
                <i class="fa-solid fa-star cursor-pointer" onclick="setRating(3)"></i>
                <i class="fa-solid fa-star cursor-pointer" onclick="setRating(4)"></i>
                <i class="fa-solid fa-star cursor-pointer" onclick="setRating(5)"></i>
            </div>

            <textarea id="rating-comment" placeholder="Your feedback..." class="w-full bg-[#131314] border border-[#2d2f31] text-xs p-2.5 rounded-xl text-gray-100 focus:outline-none"></textarea>

            <div class="flex gap-2">
                <button onclick="closeRatingModal()" class="flex-1 py-2 bg-[#2d2f31] text-xs rounded-xl">Cancel</button>
                <button onclick="submitRating()" class="flex-1 py-2 bg-blue-600 text-xs font-bold rounded-xl">Submit</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const GROQ_API_KEY = "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";

        const syncChannel = new BroadcastChannel('spar_ai_sync_channel');
        let selectedImageData = null;
        let selectedStars = 5;
        let currentChatId = null;
        let currentAuthMode = 'signup';

        // 1. ACCOUNT AUTHENTICATION & MANAGEMENT
        function initUserSession() {
            let activeUser = localStorage.getItem('spar_ai_active_user');
            if (!activeUser) {
                activeUser = 'Guest_' + Math.random().toString(36).substr(2, 5);
                localStorage.setItem('spar_ai_active_user', activeUser);
                
                // Store in user list
                let userAccounts = JSON.parse(localStorage.getItem('spar_ai_user_accounts') || '{}');
                userAccounts[activeUser] = { password: '', credits: "5" };
                localStorage.setItem('spar_ai_user_accounts', JSON.stringify(userAccounts));
            }

            const accEl = document.getElementById('user-account-id');
            if (accEl) accEl.innerText = activeUser;

            let users = JSON.parse(localStorage.getItem('spar_ai_users') || '[]');
            if (!users.includes(activeUser)) {
                users.push(activeUser);
                localStorage.setItem('spar_ai_users', JSON.stringify(users));
                syncChannel.postMessage({ type: 'USER_UPDATED' });
            }
        }

        function openAuthModal() {
            const activeUser = localStorage.getItem('spar_ai_active_user') || 'Guest';
            document.getElementById('current-username-display').innerText = activeUser;
            switchAuthTab('info');
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-modal').classList.add('flex');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('auth-modal').classList.remove('flex');
        }

        function switchAuthTab(mode) {
            currentAuthMode = mode;
            const infoView = document.getElementById('account-info-view');
            const formView = document.getElementById('account-form-view');
            const submitBtn = document.getElementById('auth-submit-btn');
            const title = document.getElementById('auth-title');

            if (mode === 'info') {
                infoView.classList.remove('hidden');
                formView.classList.add('hidden');
                title.innerText = "User Account";
            } else if (mode === 'signup') {
                infoView.classList.add('hidden');
                formView.classList.remove('hidden');
                title.innerText = "Create New Account";
                submitBtn.innerText = "Register";
            } else if (mode === 'login') {
                infoView.classList.add('hidden');
                formView.classList.remove('hidden');
                title.innerText = "Login / Switch Account";
                submitBtn.innerText = "Login";
            }
        }

        function submitAuthForm() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!username || !password) {
                alert("Please fill in both username and password!");
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('spar_ai_user_accounts') || '{}');

            if (currentAuthMode === 'signup') {
                if (accounts[username]) {
                    alert("Account username already exists! Choose another or log in.");
                    return;
                }
                accounts[username] = { password: password, credits: "5" };
                localStorage.setItem('spar_ai_user_accounts', JSON.stringify(accounts));
                localStorage.setItem('spar_ai_active_user', username);
                alert("Account created successfully!");
            } else if (currentAuthMode === 'login') {
                if (!accounts[username] || accounts[username].password !== password) {
                    alert("Invalid username or password!");
                    return;
                }
                localStorage.setItem('spar_ai_active_user', username);
                alert("Logged in successfully!");
            }

            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            closeAuthModal();
            initUserSession();
            loadAdminSettings();
            createNewChatSession();
        }

        // 2. ADMIN SETTINGS LOAD & SYNC
        function loadAdminSettings() {
            const planName = localStorage.getItem('spar_ai_plan_name') || "Spar AI Pro";
            const tenure   = localStorage.getItem('spar_ai_tenure') || "1 Month";
            const price    = localStorage.getItem('spar_ai_sub_price') || "$4.99 / Month";
            const credits  = localStorage.getItem('spar_ai_free_credits') || "5";

            const planBadge = document.getElementById('user-plan-badge');
            if (planBadge) planBadge.textContent = `${planName} (${tenure})`;

            const creditDisplay = document.getElementById('user-credits-display');
            if (creditDisplay) creditDisplay.textContent = credits;

            const priceDisplay = document.getElementById('user-price-display');
            if (priceDisplay) priceDisplay.textContent = price;
        }

        syncChannel.onmessage = () => loadAdminSettings();

        // 3. CHAT SESSIONS & HISTORY PER USER
        function getUserChatStorageKey() {
            const activeUser = localStorage.getItem('spar_ai_active_user') || 'Guest';
            return `spar_ai_chats_${activeUser}`;
        }

        function getStoredChats() {
            return JSON.parse(localStorage.getItem(getUserChatStorageKey()) || '[]');
        }

        function saveStoredChats(chats) {
            localStorage.setItem(getUserChatStorageKey(), JSON.stringify(chats));
            renderHistoryDrawerList();
        }

        function createNewChatSession() {
            const chats = getStoredChats();
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'New Conversation',
                messages: [],
                createdAt: new Date().toISOString()
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveStoredChats(chats);
            renderActiveChat();
            if (!document.getElementById('history-drawer').classList.contains('-translate-x-full')) {
                toggleHistoryDrawer();
            }
        }

        function switchChatSession(chatId) {
            currentChatId = chatId;
            renderActiveChat();
            toggleHistoryDrawer();
        }

        function renameChatSession(chatId, event) {
            event.stopPropagation();
            const chats = getStoredChats();
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            const newTitle = prompt("Enter a new name for this chat:", chat.title);
            if (newTitle && newTitle.trim()) {
                chat.title = newTitle.trim();
                saveStoredChats(chats);
            }
        }

        function deleteChatSession(chatId, event) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this chat?")) return;

            let chats = getStoredChats();
            chats = chats.filter(c => c.id !== chatId);

            if (currentChatId === chatId) {
                currentChatId = chats.length > 0 ? chats[0].id : null;
            }

            saveStoredChats(chats);
            
            if (!currentChatId) {
                createNewChatSession();
            } else {
                renderActiveChat();
            }
        }

        function toggleHistoryDrawer() {
            const drawer = document.getElementById('history-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            drawer.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function renderHistoryDrawerList() {
            const chats = getStoredChats();
            const container = document.getElementById('history-list');
            container.innerHTML = '';

            if (chats.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No saved conversations</p>`;
                return;
            }

            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl text-xs flex items-center justify-between cursor-pointer transition ${isActive ? 'bg-blue-600/20 border border-blue-500/30 text-blue-400' : 'bg-[#131314] border border-[#2d2f31] text-gray-300 hover:border-gray-500'}`;
                item.onclick = () => switchChatSession(chat.id);

                item.innerHTML = `
                    <div class="flex items-center gap-2 truncate pr-2">
                        <i class="fa-regular fa-message text-[11px]"></i>
                        <span class="truncate font-medium">${chat.title}</span>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="renameChatSession('${chat.id}', event)" class="p-1 text-gray-400 hover:text-blue-400 transition" title="Rename Chat">
                            <i class="fa-solid fa-pen text-[10px]"></i>
                        </button>
                        <button onclick="deleteChatSession('${chat.id}', event)" class="p-1 text-gray-400 hover:text-red-400 transition" title="Delete Chat">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function renderActiveChat() {
            const chats = getStoredChats();
            let currentChat = chats.find(c => c.id === currentChatId);

            if (!currentChat && chats.length > 0) {
                currentChat = chats[0];
                currentChatId = currentChat.id;
            } else if (!currentChat) {
                createNewChatSession();
                return;
            }

            const chatContainer = document.getElementById('chat-container');
            
            chatContainer.innerHTML = `
                <div class="bg-[#1e1f20] border border-[#2d2f31] p-4 rounded-2xl space-y-2 shrink-0">
                    <h2 class="font-bold text-base text-blue-400 flex items-center gap-2">
                        <i class="fa-solid fa-robot"></i> Spar AI Assistant
                    </h2>
                    <p class="text-xs text-gray-300 leading-relaxed">
                        Powered by Groq High-Speed Inference. Ask anything or attach an image below.
                    </p>
                </div>
            `;

            currentChat.messages.forEach(msg => {
                if (msg.role === 'user') {
                    const userCard = document.createElement('div');
                    userCard.className = "bg-[#1e1f20] border border-[#2d2f31] p-3 rounded-2xl ml-auto max-w-[85%] space-y-2 shrink-0";
                    let imgHTML = msg.imageData ? `<img src="${msg.imageData}" class="max-h-48 rounded-lg border border-[#2d2f31] mb-2">` : '';
                    userCard.innerHTML = `${imgHTML}<p class="text-xs sm:text-sm text-gray-100">${msg.content}</p>`;
                    chatContainer.appendChild(userCard);
                } else {
                    const aiCard = document.createElement('div');
                    aiCard.className = "bg-[#131314] border border-[#2d2f31] p-3 rounded-2xl mr-auto max-w-[85%] text-xs text-gray-300 leading-relaxed space-y-2 shrink-0";
                    aiCard.innerHTML = msg.content;
                    chatContainer.appendChild(aiCard);
                }
            });

            chatContainer.scrollTop = chatContainer.scrollHeight;
            renderHistoryDrawerList();
        }

        function appendMessageToCurrentChat(role, content, imageData = null) {
            const chats = getStoredChats();
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            chat.messages.push({ role, content, imageData, timestamp: new Date().toISOString() });
            
            if (chat.messages.length === 1 && role === 'user') {
                chat.title = content.length > 25 ? content.substring(0, 25) + '...' : content;
            }

            saveStoredChats(chats);
        }

        // 4. RAZORPAY SUBSCRIPTION
        function openRazorpaySubscription() {
            const razorpayKey = localStorage.getItem('spar_ai_razorpay_key');
            const planName    = localStorage.getItem('spar_ai_plan_name') || "Spar AI Pro";
            const rawPrice    = localStorage.getItem('spar_ai_sub_price') || "4.99";

            if (!razorpayKey) {
                alert("Please configure your Razorpay Key ID in admin.html first!");
                return;
            }

            const numericAmount = parseFloat(rawPrice.replace(/[^0-9.]/g, '')) || 4.99;
            const amountInSubunits = Math.round(numericAmount * 100);

            const options = {
                "key": razorpayKey,
                "amount": amountInSubunits,
                "currency": "INR",
                "name": "Spar AI",
                "description": `${planName} Subscription`,
                "handler": function (response) {
                    alert("Payment successful! ID: " + response.razorpay_payment_id);
                    localStorage.setItem('spar_ai_free_credits', 'Unlimited');
                    loadAdminSettings();
                },
                "theme": { "color": "#2563eb" }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }

        // 5. ATTACHMENT HANDLERS
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageData = e.target.result;
                    document.getElementById('image-preview-thumb').src = selectedImageData;
                    document.getElementById('image-file-name').innerText = file.name;
                    document.getElementById('image-preview-box').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removeAttachedImage() {
            selectedImageData = null;
            document.getElementById('image-file-input').value = '';
            document.getElementById('image-preview-box').classList.add('hidden');
        }

        // 6. GROQ API ENGINE INTEGRATION
        async function handleSendMessage() {
            const input = document.getElementById('user-input');
            const userPrompt = input.value.trim();
            if (!userPrompt && !selectedImageData) return;

            let currentCredits = localStorage.getItem('spar_ai_free_credits') || "5";
            if (currentCredits !== "Unlimited") {
                let numCredits = parseInt(currentCredits);
                if (isNaN(numCredits) || numCredits <= 0) {
                    alert("You have run out of credits! Please subscribe to get Unlimited access.");
                    return;
                }
                localStorage.setItem('spar_ai_free_credits', (numCredits - 1).toString());
                loadAdminSettings();
            }

            const chatContainer = document.getElementById('chat-container');

            const userCard = document.createElement('div');
            userCard.className = "bg-[#1e1f20] border border-[#2d2f31] p-3 rounded-2xl ml-auto max-w-[85%] space-y-2 shrink-0";
            let imgHTML = selectedImageData ? `<img src="${selectedImageData}" class="max-h-48 rounded-lg border border-[#2d2f31] mb-2">` : '';
            userCard.innerHTML = `${imgHTML}<p class="text-xs sm:text-sm text-gray-100">${userPrompt || 'Analyze attached image'}</p>`;
            chatContainer.appendChild(userCard);

            const promptToSend = userPrompt || "Please analyze this image.";
            const attachedImgCopy = selectedImageData;

            input.value = '';
            removeAttachedImage();
            chatContainer.scrollTop = chatContainer.scrollHeight;

            appendMessageToCurrentChat('user', promptToSend, attachedImgCopy);

            const aiCard = document.createElement('div');
            aiCard.className = "bg-[#131314] border border-[#2d2f31] p-3 rounded-2xl mr-auto max-w-[85%] text-xs text-gray-300 leading-relaxed space-y-2 shrink-0";
            aiCard.innerHTML = `<span class="inline-flex items-center gap-2 text-blue-400 font-medium"><i class="fa-solid fa-spinner fa-spin"></i> Thinking...</span>`;
            chatContainer.appendChild(aiCard);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are Spar AI, an intelligent, helpful AI assistant." },
                            { role: "user", content: promptToSend }
                        ],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Groq API error");
                }

                const data = await response.json();
                const aiResponseText = data.choices[0].message.content;
                const formattedResponse = aiResponseText.replace(/\n/g, '<br>');

                aiCard.innerHTML = formattedResponse;
                appendMessageToCurrentChat('assistant', formattedResponse);

            } catch (err) {
                const errHTML = `<span class="text-red-400"><i class="fa-solid fa-circle-exclamation"></i> Error: ${err.message || 'Could not connect to AI endpoint.'}</span>`;
                aiCard.innerHTML = errHTML;
                appendMessageToCurrentChat('assistant', errHTML);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 7. RATING MODAL HANDLERS
        function openRatingModal() { 
            document.getElementById('rating-modal').classList.remove('hidden'); 
            document.getElementById('rating-modal').classList.add('flex'); 
        }
        function closeRatingModal() { 
            document.getElementById('rating-modal').classList.add('hidden'); 
            document.getElementById('rating-modal').classList.remove('flex'); 
        }
        function setRating(stars) { selectedStars = stars; }

        function submitRating() {
            const comment = document.getElementById('rating-comment').value.trim();
            const ratings = JSON.parse(localStorage.getItem('spar_ai_user_ratings') || '[]');
            
            ratings.push({
                userName: localStorage.getItem('spar_ai_active_user') || 'App User',
                rating: selectedStars,
                comment: comment || 'No comment provided.',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            localStorage.setItem('spar_ai_user_ratings', JSON.stringify(ratings));
            syncChannel.postMessage({ type: 'RATING_SUBMITTED' });
            
            alert("Feedback saved!");
            closeRatingModal();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initUserSession();
            loadAdminSettings();
            
            const chats = getStoredChats();
            if (chats.length === 0) {
                createNewChatSession();
            } else {
                currentChatId = chats[0].id;
                renderActiveChat();
            }
        });
        window.addEventListener('storage', loadAdminSettings);
    </script>
</body>
</html>
